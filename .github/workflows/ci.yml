name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ft, POSTGRES_PASSWORD: ft, POSTGRES_DB: football_trivia_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ft:ft@localhost:5432/football_trivia_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @ft/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
