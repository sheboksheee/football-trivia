# Render deployment (https://render.com).
# Demo mode with a database: rooms, question approvals, license decisions and the fetched
# football-data.org responses are stored in PostgreSQL, so they survive restarts and sleeps.
# NOTE: Render's FREE PostgreSQL expires 30 days after creation (then a 14-day grace period to
# upgrade to a paid instance before it is deleted). Upgrade it to a paid plan to keep the data.
services:
  - type: web
    name: football-trivia
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ft/web build && pnpm --filter @ft/server build
    # Free instances have 512 MB: cap the JS heap so the GC works harder before the OS kills us.
    startCommand: node --max-old-space-size=400 apps/server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DEMO_MODE
        value: 'true'
      # Real questions only: skipping the fictional league halves boot time on the free instance.
      - key: FIXTURE_CONTENT
        value: 'false'
      - key: WEB_DIST
        value: apps/web/dist
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: football-trivia-db
          property: connectionString
      # Optional: your football-data.org token. Render asks for it in the dashboard; never commit it.
      - key: FOOTBALL_DATA_API_KEY
        sync: false

databases:
  - name: football-trivia-db
    plan: free
    databaseName: football_trivia
    user: football_trivia
